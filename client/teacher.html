<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>无线网络虚拟实验室 教师台</title>
<link rel="stylesheet" href="/client/assets/app.css?v=20260413b" />
<script src="/client/assets/echarts.min.js"></script>
</head>
<body data-route-role="__ROUTE_ROLE__" data-auto-connect="__AUTO_CONNECT__" data-default-room="__DEFAULT_ROOM__">
<div class="shell teacherShell" style="--teacher-sidebar:0">
<header class="top">
  <div><strong>无线网络虚拟实验室 教师台</strong><div class="small" style="color:#d2deef">学生提交汇总 | 实时查看 | 导出结果</div></div>
  <div class="toolbar">
    <button class="tool" id="exportBoardBtn">导出汇总CSV</button>
    <button class="tool" id="themeBtn">切换深色</button>
  </div>
</header>
<!-- 在线学生横条 -->
<div class="onlineStudentsBar">
  <div class="onlineStudentsScroll" id="onlineStudentsScroll">
    <!-- 动态渲染学生卡片 -->
  </div>
  <div class="onlineStudentsCount" id="onlineStudentsCount">在线学生：0 人</div>
</div>
<!-- 统计卡片 -->
<section class="statsCards">
  <div class="statCard">
    <div class="statLabel">提交总数</div>
    <div class="statValue" id="statTotal">0</div>
  </div>
  <div class="statCard good">
    <div class="statLabel">通过</div>
    <div class="statValue" id="statPass">0</div>
  </div>
  <div class="statCard warn">
    <div class="statLabel">DNS异常</div>
    <div class="statValue" id="statWarn">0</div>
  </div>
  <div class="statCard bad">
    <div class="statLabel">未通过</div>
    <div class="statValue" id="statFail">0</div>
  </div>
</section>
<!-- 图表面板 -->
<section class="chartsPanel">
  <div class="chartContainer">
    <div class="chartTitle">测试结果分布</div>
    <div id="pieChart" style="width:100%;height:300px;"></div>
  </div>
  <div class="chartContainer">
    <div class="chartTitle">实时趋势</div>
    <div id="trendChart" style="width:100%;height:300px;"></div>
  </div>
  <div class="chartContainer">
    <div class="chartTitle">小组排名（前10）</div>
    <div id="rankingChart" style="width:100%;height:300px;"></div>
  </div>
</section>
<div class="teacherMain">
  <section class="panel pad teacherBoardPanel" style="width:100%">
    <div class="teacherBoardHead">
      <div>
        <div class="ttl" style="margin-bottom:4px">学生提交数据</div>
        <div class="small" id="boardSummary">当前还没有学生提交结果。</div>
      </div>
      <div class="teacherBoardMeta" id="teacherResult">等待学生提交。</div>
    </div>
    <div class="teacherBoardCards" id="boardCards"></div>
    <div class="teacherTableWrap">
      <table class="table">
        <thead>
          <tr><th>班级</th><th>小组</th><th>姓名</th><th>分数</th><th>测试</th></tr>
        </thead>
        <tbody id="boardBody"></tbody>
      </table>
    </div>
  </section>
</div>
<footer class="bottom">
  <div class="status"><div>系统日志</div><div class="log" id="log">[init] 教师台已加载。</div></div>
  <div class="status"><div>联机状态</div><div class="log" id="netState">room=未连接</div></div>
  <div class="status">
    <div>结果提示</div>
    <div class="noticeCard notice-info" id="linkNoticeCard" aria-live="polite">
      <div class="noticeHead">
        <div class="noticeIcon" id="linkNoticeIcon">i</div>
        <div>
          <div class="noticeTitle" id="linkNoticeTitle">等待数据</div>
          <div class="noticeText" id="linkNoticeText">等待学生端提交实验结果。</div>
        </div>
      </div>
    </div>
  </div>
  <div class="status"><div>最近统计</div><div class="score" id="score">0 / 0</div></div>
</footer>
</div>
<script src="/client/assets/teacher-app.js?v=20260413b"></script>
</body>
</html>
