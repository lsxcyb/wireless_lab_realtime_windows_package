<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>无线网络虚拟实验室入口</title>
<link rel="stylesheet" href="/client/assets/app.css" />
</head>
<body>
<main class="entryShell">
  <section class="entryHero">
    <p class="entryEyebrow">Wireless Lab Realtime</p>
    <h1>无线网络虚拟实验室</h1>
    <p class="entryLead">请选择身份后直接进入联机实验。教师端与学生端会自动带入默认教室并尝试连接服务。</p>
  </section>
  <section class="entryGrid">
    <a class="entryCard teacher" href="/teacher">
      <span class="entryLabel">教师端入口</span>
      <strong>进入教师控制台</strong>
      <span>适用于投屏演示、课堂控制、全班同步与结果汇总。</span>
    </a>
    <a class="entryCard student" href="/student">
      <span class="entryLabel">学生端入口</span>
      <strong>进入学生实验台</strong>
      <span>适用于分组接入、拓扑操作、配置测试与提交结果。</span>
    </a>
  </section>
  <p class="entryFoot">也可直接通过 <a href="/student">学生端入口</a> 或 <a href="/teacher">教师端入口</a> 访问。</p>
</main>
</body>
</html>
